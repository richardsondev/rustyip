[package]
name = "RustyIP"
version = "2.0.0"
edition = "2024"
license = "MIT"

[dependencies]
rand = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[[bin]]
name = "RustyIP"
path = "src/main.rs"

[features]
default = ["embed-config"]
# embed-config: allow configuration values to be supplied by a compiled-in
# region as well as environment variables. Disable with --no-default-features.
embed-config = []
